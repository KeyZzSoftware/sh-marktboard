<title>S&amp;H Marktboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Kopf mit Logo, Börsen-Status, VIX und Quartalszahlen-Leiste (Jetzt in der Mitte);
   links Chart mit Info-Zeitstempeln, rechts mitlaufend VIX, Tagesbilanz, Unternehmen; unten Branchen-Heatmap.
   Logo-Farben: Navy als Grund, Gold = über Vortag, aufgehelltes Logo-Blau = unter Vortag. */
:root{
  color-scheme:dark;
  --bg:#07111B; --panel:rgba(13,26,40,.66); --panel-2:rgba(19,37,54,.92);
  --fg:#EEF1F4; --fg-2:#B7C0CA; --muted:#8892A0; --rule:rgba(238,241,244,.09);
  --gold:#E3C47F; --blue:#6A9CCF; --mood-rgb:106,156,207; --mood-a:.6; --c:106,156,207; --vc:227,196,127;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.mood{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
.mood i{position:absolute;border-radius:50%;filter:blur(60px);opacity:var(--mood-a)}
.mood i:nth-child(1){width:70vmax;height:50vmax;right:-18vmax;top:-26vmax;background:radial-gradient(closest-side,rgba(var(--mood-rgb),.42),transparent);animation:d1 26s ease-in-out infinite alternate}
.mood i:nth-child(2){width:60vmax;height:44vmax;left:-22vmax;bottom:-24vmax;background:radial-gradient(closest-side,rgba(var(--mood-rgb),.26),transparent);animation:d2 32s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(-8vmax,6vmax) scale(1.08)}}
@keyframes d2{to{transform:translate(9vmax,-5vmax) scale(1.12)}}

/* Kopf */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:rgba(7,17,27,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.top-row{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{height:20px;width:auto;opacity:.75;flex:none}
.markets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.markets::-webkit-scrollbar{display:none}
.mk{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:99px;border:1px solid var(--rule);font-size:12px;color:var(--fg-2);white-space:nowrap}
.mk b{font-weight:600;color:var(--fg)}
.mk .d{width:7px;height:7px;border-radius:50%;background:#59626E}
.mk.open{border-color:rgba(227,196,127,.35)}
.mk.open .d{background:var(--gold);animation:pulse 2.2s infinite}
.mk.lunch .d{background:rgba(227,196,127,.5)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,196,127,.55)}70%{box-shadow:0 0 0 7px rgba(227,196,127,0)}100%{box-shadow:0 0 0 0 rgba(227,196,127,0)}}
.vixmini{flex:none;display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:99px;background:rgba(var(--vc),.12);border:1px solid rgba(var(--vc),.4);font-size:12px;cursor:pointer}
.vixmini b{font-weight:600}.vixmini span{color:rgb(var(--vc))}
@media (max-width:700px){.top-row{flex-wrap:wrap}.markets{order:3;flex-basis:100%}.vixmini{margin-left:auto}}

/* Quartalszahlen-Leiste */
.q{max-width:1440px;margin:8px auto 0;position:relative;height:86px;overflow:hidden;cursor:grab;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.q.drag{cursor:grabbing}
.qtrack{position:absolute;top:0;left:0;height:100%;transition:transform 1.2s var(--ease)}
.q.drag .qtrack{transition:none}
.qnow{position:absolute;top:2px;bottom:6px;left:50%;width:0;border-left:1px dashed rgba(227,196,127,.55);pointer-events:none;z-index:2}
.qnow span{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:#07111B;background:var(--gold);padding:1px 7px;border-radius:99px;white-space:nowrap}
.qday{position:absolute;bottom:6px;font-size:10.5px;color:var(--muted);white-space:nowrap;padding-left:6px;border-left:1px solid var(--rule)}
.qi{position:absolute;top:20px;width:164px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;padding:6px 8px;border-radius:12px;border:1px solid var(--rule);
  background:var(--panel);cursor:pointer;text-align:left;transform:translateX(-50%);transition:border-color .25s,background .25s}
.qi:hover{border-color:rgba(238,241,244,.25);background:var(--panel-2)}
.qi:focus-visible{outline:2px solid var(--gold)}
.qi.past{opacity:.92}
.qi .bd{grid-row:span 2;display:flex}
.qi .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi .ln{font-size:11px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi .ln b{font-weight:600}
.bdg{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.02em;background:#1B3149;color:var(--fg);
  box-shadow:0 0 0 2px var(--ring,rgba(238,241,244,.18));flex:none}
.bdg+.bdg{margin-left:-9px}
.up{color:var(--gold)}.dn{color:var(--blue)}

/* Hauptbereich */
.wrap{max-width:1300px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;margin-top:22px;align-items:start}
@media (max-width:1020px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--rule);background:var(--panel);font-size:12.5px;cursor:pointer;color:var(--fg-2);transition:all .25s}
.tab:hover{color:var(--fg);border-color:rgba(238,241,244,.22)}
.tab[aria-pressed="true"]{color:var(--fg);background:var(--panel-2);border-color:rgba(var(--c),.6);box-shadow:0 6px 18px -10px rgba(var(--c),.9)}
.tab:focus-visible{outline:2px solid var(--gold)}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--rule);color:var(--fg-2);margin-top:12px}
.badge.est{border-color:rgba(227,196,127,.45);color:var(--gold)}
h1{font-size:clamp(22px,3vw,30px);font-weight:600;letter-spacing:-.01em;margin:6px 0 0}
.figure{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:4px}
.big{font-size:clamp(38px,6vw,60px);font-weight:600;letter-spacing:-.03em;line-height:1}
.pill{font-size:15px;font-weight:600;padding:5px 12px;border-radius:99px;color:rgb(var(--c));background:rgba(var(--c),.13);border:1px solid rgba(var(--c),.4);box-shadow:0 0 26px -8px rgba(var(--c),.8)}
.abs{font-size:15px;color:rgb(var(--c));font-weight:500}
.facts{margin-top:8px;color:var(--muted);font-size:13px;display:flex;gap:6px 16px;flex-wrap:wrap}
.facts b{color:var(--fg-2);font-weight:500}
.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.chart-card{margin-top:14px;border-radius:var(--r);border:1px solid var(--rule);background:linear-gradient(180deg,rgba(19,37,54,.7),rgba(13,26,40,.35));padding:8px 4px 4px}
.chart{position:relative;width:100%;height:clamp(320px,44vw,480px);touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:2px 12px 8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fade .8s .3s var(--ease) forwards}
@keyframes fade{to{opacity:1}}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise .7s var(--ease) both}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.flag{cursor:pointer}
.flag rect{transition:fill .2s}
.flag:hover rect,.flag.on rect{fill:rgba(var(--fc),.35)}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.6}100%{transform:scale(2.8);opacity:0}}
.tip{position:absolute;pointer-events:none;min-width:150px;padding:8px 10px;border-radius:10px;background:rgba(7,17,27,.95);border:1px solid rgba(238,241,244,.16);font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:3}
.tip .t{color:var(--muted)}
.tip .row{display:flex;justify-content:space-between;gap:14px;white-space:nowrap}

/* Info-Fenster */
.pop{position:fixed;z-index:50;width:min(340px,calc(100vw - 24px));padding:14px 14px 12px;border-radius:14px;background:rgba(9,19,30,.97);border:1px solid rgba(238,241,244,.16);
  box-shadow:0 24px 60px rgba(0,0,0,.6);font-size:13px;animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pop .x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(238,241,244,.08);cursor:pointer;font-size:14px;line-height:1}
.pop .when{font-size:11.5px;color:var(--muted);padding-right:30px}
.pop h3{font-size:15px;font-weight:600;margin:3px 0 8px;padding-right:20px;line-height:1.3}
.pop ul{margin:0;padding-left:18px;color:var(--fg-2)}
.pop li+li{margin-top:3px}
.pop .why{margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(238,241,244,.05);color:var(--fg-2)}
.pop .why b{color:var(--fg)}
.pop .mv{margin-top:8px;font-size:12px;color:var(--muted)}
.pop table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.pop td{padding:5px 4px;border-bottom:1px solid var(--rule)}
.pop td:last-child{text-align:right}
.pop .grp{display:flex;flex-direction:column;gap:6px}
.pop .gi{display:flex;align-items:center;gap:10px;padding:7px;border-radius:10px;border:1px solid var(--rule);background:rgba(238,241,244,.03);cursor:pointer;text-align:left}
.pop .gi:hover{border-color:rgba(238,241,244,.25)}
.pop .gi div{flex:1;min-width:0}
.pop .gi small{display:block;color:var(--fg-2);font-size:11.5px}

/* Seitenspalte */
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:1021px) and (min-height:900px){.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px)}}
.panel{border-radius:var(--r);border:1px solid var(--rule);background:var(--panel);padding:14px}
.panel h2{font-size:15px;font-weight:600;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 small{font-size:11.5px;font-weight:400;color:var(--muted)}
.vix-top{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;margin-top:8px;cursor:pointer}
.vix-top svg{width:100%;height:auto;display:block}
.lv{width:100%;border-collapse:collapse;font-size:11.5px}
.lv td{padding:4px 6px;color:var(--muted);border-bottom:1px solid var(--rule)}
.lv tr:last-child td{border-bottom:0}
.lv td:first-child{white-space:nowrap}
.lv tr.on td{color:var(--fg);background:rgba(var(--vc),.14)}
.lv tr.on td:first-child{box-shadow:inset 2px 0 0 rgb(var(--vc))}
.rows{display:flex;flex-direction:column;gap:1px;margin-top:8px}
.bar,.co{display:grid;align-items:center;gap:8px;padding:6px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left}
.bar{grid-template-columns:110px 1fr 62px}
.co{grid-template-columns:minmax(0,1fr) 56px auto}
.bar:hover,.bar.on,.co:hover,.co.on{background:rgba(238,241,244,.06)}
.bar:focus-visible,.co:focus-visible{outline:2px solid var(--gold)}
.bar .bn,.co .bn{font-size:12.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .bn small{display:block;font-size:11px;color:var(--muted)}
.bar.on .bn,.co.on .bn{color:var(--fg)}
.bar .track{position:relative;height:8px}
.bar .track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:rgba(238,241,244,.2)}
.bar .fill{position:absolute;top:0;bottom:0;width:0;border-radius:4px;background:rgb(var(--c));box-shadow:0 0 12px rgba(var(--c),.6);transition:width 1.1s var(--ease)}
.bp{font-size:12px;font-weight:600;text-align:right;color:rgb(var(--c))}
.cohead{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px}
.cohead h2{font-size:15px;font-weight:600;margin:0}.cohead small{font-size:11.5px;color:var(--muted)}
.cogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.cogrid .co{grid-template-columns:1fr auto;grid-template-areas:"n p" "s s";padding:10px;border:1px solid var(--rule);border-radius:12px;background:var(--panel);gap:6px 8px}
.cogrid .co.on{border-color:rgba(var(--c),.6);background:var(--panel-2)}
.co .bn{grid-area:n}.co .bp{grid-area:p}
.co svg{grid-area:s;width:100%;height:26px;display:block}
.co .bp small{display:block;font-weight:400;color:var(--fg-2)}

/* Heatmap */
.heat{margin-top:30px}
.heat>h2{font-size:20px;font-weight:600;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.heat>h2 small{font-size:12px;font-weight:400;color:var(--muted)}
.map{position:relative;margin-top:12px;height:clamp(420px,46vw,560px)}
.sec{position:absolute;padding:2px}
.sec>div{position:absolute;inset:2px;border-radius:10px;overflow:hidden;background:rgba(13,26,40,.8);border:1px solid var(--rule)}
.sech{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;font-size:11.5px;font-weight:600;background:rgba(7,17,27,.55);white-space:nowrap;overflow:hidden}
.sech span{overflow:hidden;text-overflow:ellipsis}
.sech em{font-style:normal;margin-left:auto;color:rgb(var(--c))}
.sech button{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid rgba(238,241,244,.3);background:rgba(238,241,244,.08);font-size:10.5px;font-weight:700;cursor:pointer;line-height:1;padding:0}
.sech button:hover{background:rgba(238,241,244,.2)}
.tile{position:absolute;border:0;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:2px;transition:filter .2s,transform .2s}
.tile:hover{filter:brightness(1.25);z-index:2}
.tile:focus-visible{outline:2px solid var(--fg);z-index:3}
.tile b{font-size:12px;font-weight:600}
.tile small{font-size:11px}
.tile.rest{cursor:default;filter:saturate(.55) brightness(.78)}
.tile.rest:hover{filter:saturate(.55) brightness(.78)}
footer{margin-top:24px;color:var(--muted);font-size:11.5px}
footer a{color:var(--fg-2)}
.panel,.chart-card,.cogrid .co,.qi,.reg,.sec>div,.pop{border:1px solid rgba(255,255,255,.17)!important}
.panel,.cogrid .co,.qi{background:linear-gradient(160deg,rgba(30,56,84,.78),rgba(12,24,38,.78))}
.panel,.chart-card,.cogrid .co,.reg{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 22px 44px -30px rgba(0,0,0,.95)}
.chart-card{background:linear-gradient(170deg,rgba(32,62,94,.62),rgba(10,20,32,.45))}
.panel h2,.cohead h2,.heat>h2{padding-left:10px;border-left:3px solid var(--gold)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}.hrow .badge{margin-top:0}
.back{border:1px solid rgba(255,255,255,.17);background:rgba(19,37,54,.8);color:var(--fg);border-radius:99px;padding:4px 12px;font-size:12px;cursor:pointer}
.back:hover{border-color:rgba(227,196,127,.6)}
h1{display:flex;align-items:center;gap:10px}
.bar.avg{margin-bottom:6px;padding:9px 6px;background:rgba(var(--c),.1);border:1px solid rgba(var(--c),.35)}
.bar.avg .bn{color:var(--fg);font-weight:600}
.lg{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;overflow:hidden;flex:none;position:relative;box-shadow:0 0 0 2px var(--ring,rgba(255,255,255,.2))}
.lg img{width:76%;height:76%;object-fit:contain;display:block}
.lg b{display:none;font-size:9.5px;font-weight:700;color:var(--fg);letter-spacing:.02em}
.lg.nologo{background:#1D3550}.lg.nologo img{display:none}.lg.nologo b{display:block}
.lg.hl{width:34px;height:34px}
.bd{display:flex}.bd .bdgw+.bdgw{margin-left:-9px}
.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}
.reg{border-radius:14px;padding:11px 12px;background:linear-gradient(160deg,rgba(var(--c),.17),rgba(12,24,38,.8))}
.rh{display:flex;justify-content:space-between;font-weight:600}.rh b{color:rgb(var(--c))}
.rc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rc button{border:1px solid rgba(255,255,255,.15);background:rgba(7,17,27,.45);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.rc button:hover{border-color:rgba(var(--c),.7)}.rc i{font-style:normal;margin-left:6px;color:rgb(var(--c));font-weight:600}
.cogrid .co{grid-template-areas:"n p" "s s" "h h"}
.co .bn{display:flex;align-items:center;gap:8px;min-width:0}.co .bt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.why1{grid-area:h;display:block;font-size:11.5px;line-height:1.35;max-height:2.7em;overflow:hidden;color:var(--fg-2);white-space:normal;text-align:left;padding-top:2px}
.why1 i{font-style:normal;color:var(--gold);font-weight:600}.why1.q{color:var(--muted)}
.sec>div{background:rgba(9,18,29,.9)}
.sech{height:28px;background:linear-gradient(90deg,rgba(var(--c),.22),rgba(7,17,27,.5));font-size:12px}
.tile{flex-direction:column;gap:4px;border:1px solid rgba(255,255,255,.14)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tile small{font-size:12.5px;font-weight:700}
.tile .lg.tl{width:var(--lgs);height:var(--lgs);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.pop{width:min(390px,calc(100vw - 24px));max-height:min(72vh,620px);overflow:auto}
.pop .src{display:inline-block;margin-top:8px;padding:3px 11px;border-radius:99px;border:1px solid rgba(227,196,127,.55);color:var(--gold);text-decoration:none;font-size:12px;font-weight:600}
.pop .src:hover{background:rgba(227,196,127,.12)}
.pop small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.mvrs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 10px}
.mvrs span{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:5px}.mvrs span em{font-style:normal;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvrs .lg{width:20px;height:20px}
.nl{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule);padding-top:10px}
.ni b{display:block;font-size:13.5px;line-height:1.35;color:var(--fg)}.ni p{margin:4px 0 0;color:var(--fg-2);font-size:12.5px}
.qi{width:164px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dasharray:none;stroke-dashoffset:0}.fadein{opacity:1}}
</style>

<div class="mood" aria-hidden="true"><i></i><i></i></div>
